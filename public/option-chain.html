<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI OPTION CHAIN PRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    background:#020617;
    color:white;
    font-family:Poppins,sans-serif;
    padding:20px;
}

.card{
    background:#0f172a;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    padding:16px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.08);
}

th{
    background:#00ff99;
    color:black;
}

tr:hover{
    background:rgba(255,255,255,0.04);
}

select{
    background:#111827;
    color:white;
    border:1px solid #374151;
    padding:12px 18px;
    border-radius:12px;
    font-size:16px;
}

.buyBox{
    background:rgba(0,255,153,0.12);
    border:2px solid #00ff99;
}

.sellBox{
    background:rgba(255,0,0,0.12);
    border:2px solid #ff4d4d;
}

.sidewaysBox{
    background:rgba(255,255,0,0.08);
    border:2px solid yellow;
}

.signalBox{
    padding:25px;
    border-radius:20px;
    margin-top:25px;
}

.bigText{
    font-size:42px;
    font-weight:bold;
}

.smallText{
    margin-top:10px;
    font-size:18px;
}

.infoGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:20px;
}

.infoCard{
    background:#111827;
    padding:20px;
    border-radius:14px;
    text-align:center;
}

.label{
    color:#9ca3af;
    font-size:14px;
}

.value{
    font-size:30px;
    font-weight:bold;
    margin-top:10px;
}

.green{
    color:#00ff99;
}

.red{
    color:#ff4d4d;
}

.yellow{
    color:yellow;
}

.atmRow{
    background:rgba(0,255,153,0.08);
}

.tradePanel{
    margin-top:20px;
    padding:20px;
    border-radius:16px;
    background:#111827;
}

.tradeTitle{
    font-size:28px;
    font-weight:bold;
    margin-bottom:15px;
}

.tradeRow{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
}

</style>

</head>

<body>

<div class="card">

<h1 class="text-5xl font-bold text-green-400">
📉 AI OPTION CHAIN PRO
</h1>

<div class="mt-8 flex gap-4 flex-wrap">

<select id="indexSelect">

<option value="NIFTY">NIFTY 50</option>

<option value="BANKNIFTY">BANK NIFTY</option>

<option value="SENSEX">SENSEX</option>

<option value="NIFTYIT">NIFTY IT</option>

</select>

<button
onclick="loadOptionChain()"
class="bg-green-400 text-black px-6 py-3 rounded-xl font-bold">
LOAD SIGNAL
</button>

</div>

<div id="signalContainer"></div>

<div class="infoGrid">

<div class="infoCard">
<div class="label">LIVE PRICE</div>
<div id="livePrice" class="value">--</div>
</div>

<div class="infoCard">
<div class="label">ATM STRIKE</div>
<div id="atmStrike" class="value yellow">--</div>
</div>

<div class="infoCard">
<div class="label">PCR</div>
<div id="pcrValue" class="value">--</div>
</div>

<div class="infoCard">
<div class="label">TREND</div>
<div id="trendValue" class="value">--</div>
</div>

</div>

<div id="tradePanel"></div>

</div>

<div class="card">

<h2 class="text-3xl font-bold text-green-400">
OPTION CHAIN
</h2>

<table>

<thead>

<tr>

<th>Strike</th>
<th>CE OI</th>
<th>PE OI</th>
<th>OI CHANGE</th>
<th>PCR</th>
<th>SIGNAL</th>

</tr>

</thead>

<tbody id="optionData"></tbody>

</table>

</div>

<script>

async function loadOptionChain(){

    const selectedIndex =
    document.getElementById("indexSelect").value;

    let livePrice = 0;
    let step = 50;

    // Demo Live Prices

    if(selectedIndex === "NIFTY"){

        livePrice = 24850;
        step = 50;
    }

    else if(selectedIndex === "BANKNIFTY"){

        livePrice = 55600;
        step = 100;
    }

    else if(selectedIndex === "SENSEX"){

        livePrice = 81500;
        step = 100;
    }

    else if(selectedIndex === "NIFTYIT"){

        livePrice = 38400;
        step = 50;
    }

    document.getElementById("livePrice").innerHTML =
    livePrice.toLocaleString();

    // ATM

    const atm =
    Math.round(livePrice / step) * step;

    document.getElementById("atmStrike").innerHTML =
    atm.toLocaleString();

    const tbody =
    document.getElementById("optionData");

    tbody.innerHTML = "";

    let totalCE = 0;
    let totalPE = 0;

    let strongestStrike = atm;
    let strongestSignal = "SIDEWAYS";

    let maxDifference = 0;

    // Generate Chain

    for(let i=-5;i<=5;i++){

        const strike = atm + (i*step);

        const ceOI =
        Math.floor(Math.random()*500000)+100000;

        const peOI =
        Math.floor(Math.random()*500000)+100000;

        const oiChange =
        Math.floor(Math.random()*100000)-50000;

        const pcr =
        (peOI / ceOI).toFixed(2);

        totalCE += ceOI;
        totalPE += peOI;

        let rowSignal = "SIDEWAYS";

        if(pcr > 1.15){

            rowSignal = "BUY";

        }

        else if(pcr < 0.85){

            rowSignal = "SELL";

        }

        // Strongest Strike Detection

        const diff =
        Math.abs(peOI - ceOI);

        if(diff > maxDifference){

            maxDifference = diff;

            strongestStrike = strike;

            strongestSignal = rowSignal;
        }

        const row = `
        <tr class="${strike===atm ? 'atmRow':''}">
            <td>${strike.toLocaleString()}</td>
            <td>${ceOI.toLocaleString()}</td>
            <td>${peOI.toLocaleString()}</td>
            <td>${oiChange.toLocaleString()}</td>
            <td>${pcr}</td>
            <td>
            ${
                rowSignal==="BUY"
                ?
                '<span class="green font-bold">BUY</span>'
                :
                rowSignal==="SELL"
                ?
                '<span class="red font-bold">SELL</span>'
                :
                '<span class="yellow font-bold">SIDEWAYS</span>'
            }
            </td>
        </tr>
        `;

        tbody.innerHTML += row;
    }

    // Final PCR

    const finalPCR =
    (totalPE / totalCE).toFixed(2);

    document.getElementById("pcrValue").innerHTML =
    finalPCR;

    let finalSignal = "SIDEWAYS";
    let trend = "NEUTRAL";
    let signalClass = "sidewaysBox";
    let signalColor = "yellow";

    // Strong Filter

    if(finalPCR > 1.12){

        finalSignal = "BUY CALL";
        trend = "BULLISH";
        signalClass = "buyBox";
        signalColor = "#00ff99";
    }

    else if(finalPCR < 0.88){

        finalSignal = "BUY PUT";
        trend = "BEARISH";
        signalClass = "sellBox";
        signalColor = "#ff4d4d";
    }

    document.getElementById("trendValue").innerHTML =
    trend;

    // Entry Strike

    let entryStrike = strongestStrike;

    // Premium Estimation

    let entryPrice = 120;

    if(selectedIndex === "BANKNIFTY"){

        entryPrice = 250;
    }

    // Risk Management

    const sl =
    Math.round(entryPrice * 0.75);

    const target1 =
    Math.round(entryPrice * 1.30);

    const target2 =
    Math.round(entryPrice * 1.60);

    // Signal Box

    document.getElementById("signalContainer").innerHTML = `
    
    <div class="signalBox ${signalClass}">

        <div class="bigText" style="color:${signalColor}">
            ${finalSignal}
        </div>

        <div class="smallText">
            AI Based Option Chain Signal
        </div>

        <div class="smallText">
            PCR + OI + OI Change + Strength Analysis
        </div>

    </div>
    `;

    // Trade Panel

    document.getElementById("tradePanel").innerHTML = `
    
    <div class="tradePanel">

        <div class="tradeTitle">
        🎯 TRADE SETUP
        </div>

        <div class="tradeRow">
            <div>Signal</div>
            <div style="color:${signalColor};font-weight:bold">
            ${finalSignal}
            </div>
        </div>

        <div class="tradeRow">
            <div>Recommended Strike</div>
            <div>${entryStrike}</div>
        </div>

        <div class="tradeRow">
            <div>Suggested Entry</div>
            <div>₹ ${entryPrice}</div>
        </div>

        <div class="tradeRow">
            <div>Stop Loss</div>
            <div class="red">₹ ${sl}</div>
        </div>

        <div class="tradeRow">
            <div>Target 1</div>
            <div class="green">₹ ${target1}</div>
        </div>

        <div class="tradeRow">
            <div>Target 2</div>
            <div class="green">₹ ${target2}</div>
        </div>

        <div class="tradeRow">
            <div>Risk Reward</div>
            <div>1 : 2</div>
        </div>

        <div class="tradeRow">
            <div>Confidence</div>
            <div>
            ${
                finalSignal==="SIDEWAYS"
                ?
                "55%"
                :
                "82%"
            }
            </div>
        </div>

    </div>
    `;
}

// Initial Load

loadOptionChain();

// Auto Refresh

setInterval(loadOptionChain,15000);

</script>

</body>
</html>

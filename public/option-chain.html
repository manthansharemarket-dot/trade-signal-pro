<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MSM PRO - LIVE OPTION CHAIN</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
overflow-x:hidden;
padding:20px;
}

/* HEADER */

.header{
background:linear-gradient(135deg,#0f172a,#111827);
padding:30px;
border-radius:25px;
border:1px solid rgba(255,255,255,0.08);
margin-bottom:25px;
}

/* LIVE */

.liveBadge{
display:flex;
align-items:center;
gap:10px;
font-weight:bold;
color:#00ff99;
}

.liveDot{
width:12px;
height:12px;
background:#00ff99;
border-radius:50%;
animation:blink 1s infinite;
}

@keyframes blink{
50%{
opacity:0.3;
}
}

/* SELECT */

select{
background:#111827;
color:white;
padding:14px 18px;
border-radius:14px;
border:1px solid rgba(255,255,255,0.1);
outline:none;
font-size:16px;
}

/* BUTTON */

.btn{
background:#00ff99;
color:black;
padding:14px 24px;
border:none;
border-radius:14px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
transform:scale(1.04);
}

/* GRID */

.gridBox{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:25px;
}

/* CARD */

.card{
background:#111827;
padding:25px;
border-radius:22px;
border:1px solid rgba(255,255,255,0.06);
text-align:center;
}

.label{
color:#9ca3af;
font-size:15px;
}

.value{
font-size:38px;
font-weight:bold;
margin-top:12px;
}

/* COLORS */

.green{
color:#00ff99;
}

.red{
color:#ff4d4d;
}

.yellow{
color:#ffd60a;
}

.blue{
color:#4dabff;
}

/* SIGNAL */

.signalBox{
margin-top:30px;
padding:35px;
border-radius:25px;
text-align:center;
animation:fade 0.5s ease;
}

.buyBox{
background:rgba(0,255,153,0.12);
border:2px solid #00ff99;
}

.sellBox{
background:rgba(255,0,0,0.12);
border:2px solid #ff4d4d;
}

.sidewaysBox{
background:rgba(255,255,0,0.08);
border:2px solid #ffd60a;
}

.bigSignal{
font-size:60px;
font-weight:800;
}

.signalSub{
margin-top:12px;
font-size:20px;
}

/* TRADE PANEL */

.tradePanel{
margin-top:25px;
background:#111827;
padding:25px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.06);
}

.tradeTitle{
font-size:32px;
font-weight:bold;
margin-bottom:20px;
}

.tradeRow{
display:flex;
justify-content:space-between;
padding:14px 0;
border-bottom:1px solid rgba(255,255,255,0.06);
}

/* TABLE */

.tableWrap{
margin-top:30px;
background:#111827;
padding:25px;
border-radius:22px;
border:1px solid rgba(255,255,255,0.06);
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:16px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,0.06);
}

th{
background:#00ff99;
color:black;
font-weight:bold;
}

.atmRow{
background:rgba(0,255,153,0.08);
}

/* LOADER */

.loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
font-weight:bold;
color:#00ff99;
z-index:9999;
}

/* MOBILE */

@media(max-width:700px){

.bigSignal{
font-size:38px;
}

.value{
font-size:28px;
}

.tradeTitle{
font-size:24px;
}

}

</style>

</head>

<body>

<!-- LOADER -->

<div class="loader" id="loader">
🚀 MSM PRO LIVE
</div>

<!-- HEADER -->

<div class="header">

<div class="flex justify-between items-center flex-wrap gap-4">

<div>

<h1 class="text-5xl font-bold green">
📈 MSM PRO
</h1>

<p class="text-gray-400 mt-3">
Realtime AI Option Chain Dashboard
</p>

</div>

<div class="liveBadge">

<div class="liveDot"></div>

LIVE MARKET

</div>

</div>

<div class="mt-8 flex gap-4 flex-wrap">

<select id="indexSelect">

<option value="NIFTY">NIFTY 50</option>

<option value="BANKNIFTY">BANK NIFTY</option>

<option value="FINNIFTY">FIN NIFTY</option>

<option value="MIDCPNIFTY">MIDCAP NIFTY</option>

<option value="SENSEX">SENSEX</option>

<option value="NIFTYIT">NIFTY IT</option>

</select>

<button
onclick="loadOptionChain()"
class="btn">

LOAD LIVE DATA

</button>

</div>

<!-- SIGNAL -->

<div id="signalContainer"></div>

<!-- INFO -->

<div class="gridBox">

<div class="card">

<div class="label">
LIVE PRICE
</div>

<div class="value green" id="livePrice">
--
</div>

</div>

<div class="card">

<div class="label">
ATM STRIKE
</div>

<div class="value yellow" id="atmStrike">
--
</div>

</div>

<div class="card">

<div class="label">
PCR
</div>

<div class="value blue" id="pcrValue">
--
</div>

</div>

<div class="card">

<div class="label">
TREND
</div>

<div class="value" id="trendValue">
--
</div>

</div>

</div>

<!-- TRADE -->

<div id="tradePanel"></div>

</div>

<!-- TABLE -->

<div class="tableWrap">

<div class="flex justify-between items-center flex-wrap gap-4">

<h2 class="text-3xl font-bold green">
📊 LIVE OPTION CHAIN
</h2>

<div class="yellow font-bold">
AUTO REFRESH 10 SEC
</div>

</div>

<table>

<thead>

<tr>

<th>Strike</th>
<th>CE OI</th>
<th>PE OI</th>
<th>PCR</th>
<th>Signal</th>

</tr>

</thead>

<tbody id="optionData">

</tbody>

</table>

</div>

<!-- SCRIPT -->

<script>

/* =========================================
LOADER
========================================= */

window.onload = ()=>{

setTimeout(()=>{

document.getElementById("loader").style.display = "none";

},1200);

};



/* =========================================
LOAD LIVE DATA
========================================= */

async function loadOptionChain(){

try{

const selectedIndex =
document.getElementById("indexSelect").value;



/* =====================================
LIVE API
===================================== */

const response = await fetch(

`/api/option-chain?index=${selectedIndex}`

);

const data = await response.json();



/* =====================================
ERROR
===================================== */

if(data.error){

console.log(data.error);

return;

}



/* =====================================
LIVE PRICE
===================================== */

document.getElementById("livePrice").innerHTML =

Number(data.spot).toLocaleString();



/* =====================================
ATM
===================================== */

document.getElementById("atmStrike").innerHTML =

data.atm;



/* =====================================
PCR
===================================== */

document.getElementById("pcrValue").innerHTML =

data.finalPCR;



/* =====================================
TREND
===================================== */

let trend = "SIDEWAYS";

let trendColor = "yellow";

if(data.finalSignal === "BUY CALL"){

trend = "BULLISH";
trendColor = "#00ff99";

}

else if(data.finalSignal === "BUY PUT"){

trend = "BEARISH";
trendColor = "#ff4d4d";

}

document.getElementById("trendValue").innerHTML =

`<span style="color:${trendColor}">
${trend}
</span>`;


/* =====================================
SIGNAL STYLE
===================================== */

let signalClass = "sidewaysBox";

let signalColor = "#ffd60a";

if(data.finalSignal === "BUY CALL"){

signalClass = "buyBox";
signalColor = "#00ff99";

}

else if(data.finalSignal === "BUY PUT"){

signalClass = "sellBox";
signalColor = "#ff4d4d";

}



/* =====================================
SIGNAL BOX
===================================== */

document.getElementById("signalContainer").innerHTML = `

<div class="signalBox ${signalClass}">

<div class="bigSignal"
style="color:${signalColor}">

${data.finalSignal}

</div>

<div class="signalSub">

Realtime AI Trading Signal

</div>

<div class="signalSub">

Live Market + AI Engine + PCR Analysis

</div>

</div>

`;



/* =====================================
TRADE PANEL
===================================== */

document.getElementById("tradePanel").innerHTML = `

<div class="tradePanel">

<div class="tradeTitle">

🎯 LIVE TRADE SETUP

</div>

<div class="tradeRow">

<div>Signal</div>

<div style="
color:${signalColor};
font-weight:bold">

${data.finalSignal}

</div>

</div>

<div class="tradeRow">

<div>ATM Strike</div>

<div>${data.atm}</div>

</div>

<div class="tradeRow">

<div>Entry</div>

<div>₹ ${data.entry}</div>

</div>

<div class="tradeRow">

<div>Stop Loss</div>

<div class="red">

₹ ${data.sl}

</div>

</div>

<div class="tradeRow">

<div>Target 1</div>

<div class="green">

₹ ${data.target1}

</div>

</div>

<div class="tradeRow">

<div>Target 2</div>

<div class="green">

₹ ${data.target2}

</div>

</div>

<div class="tradeRow">

<div>Confidence</div>

<div>

${data.confidence}

</div>

</div>

</div>

`;



/* =====================================
OPTION TABLE
===================================== */

let html = "";

data.chain.forEach((item)=>{

html += `

<tr class="
${item.strike == data.atm
?'atmRow'
:''}">

<td>
${item.strike}
</td>

<td>
${Number(item.ceOI).toLocaleString()}
</td>

<td>
${Number(item.peOI).toLocaleString()}
</td>

<td>
${item.pcr}
</td>

<td>

${
item.signal === "BUY"
?

'<span class="green font-bold">BUY</span>'

:

item.signal === "SELL"
?

'<span class="red font-bold">SELL</span>'

:

'<span class="yellow font-bold">SIDEWAYS</span>'
}

</td>

</tr>

`;

});

document.getElementById("optionData").innerHTML =
html;



}catch(err){

console.log(err);

}

}



/* =========================================
INITIAL LOAD
========================================= */

loadOptionChain();



/* =========================================
AUTO REFRESH
========================================= */

setInterval(loadOptionChain,10000);

</script>

</body>

</html>

<!DOCTYPE html>
<html>
<head>

<title>Premium Plans</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{

background:#020617;

color:white;

padding:40px;

font-family:Poppins;
}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

gap:30px;
}

.card{

background:#111827;

padding:35px;

border-radius:25px;

text-align:center;
}

.price{

font-size:55px;

font-weight:700;

color:#00ff99;

margin:20px 0;
}

.btn{

padding:14px 30px;

background:#00ff99;

color:black;

font-weight:700;

border:none;

border-radius:15px;

cursor:pointer;
}

</style>

</head>

<body>

<h1 class="text-5xl font-bold text-green-400 mb-12">
💎 Premium Membership
</h1>

<div class="grid">

<div class="card">

<h2 class="text-3xl font-bold">
FREE
</h2>

<div class="price">
₹0
</div>

<p>Basic Signals</p>

</div>

<div class="card">

<h2 class="text-3xl font-bold">
PRO
</h2>

<div class="price">
₹999
</div>

<p>Premium AI Signals</p>

<br>

<button class="btn">
Buy Now
</button>

</div>

<div class="card">

<h2 class="text-3xl font-bold">
VIP
</h2>

<div class="price">
₹2999
</div>

<p>Auto Trading + VIP Alerts</p>

<br>

<button class="btn">
Buy Now
</button>

</div>

</div>

</body>
</html>
